<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./views/quiz.js"></script>
  </head>
  <body style="display: flex; flex-direction: column; gap: 8/10;">
    <div style="display: block; align-self: top;">
    <nav style="display: flex; align-items: center; justify-content: center; gap: 20px;">
      <a onclick="goHome()" style="display: inline; padding: 30px; background-color: antiquewhite;">Home</a>
      <a onclick="goQuiz()" style="display: inline; padding: 30px; background-color: antiquewhite;">Quiz</a>
      <a onclick="goQuiz()" style="display: inline; padding: 30px; background-color: antiquewhite;" href="./views/editor/edit.html">Quiz</a>
    </nav>
  </div>
    <div id="start" style="display: none">Start Quiz!</div>

    <div id="quiz">
      <div id="question">QQQQQQQQ</div>

      <div id="choices">
        <div class="choice" id="A" onclick="onPlayerSubmit('A')">AAAA</div>
        <div class="choice" id="B" onclick="onPlayerSubmit('B')">BBBB</div>
        <div class="choice" id="C" onclick="onPlayerSubmit('C')">CCCC</div>
        <div class="choice" id="D" onclick="onPlayerSubmit('D')">DD</div>
      </div>

      
    </div>
    <img id="image" width="200px">
    <div id="score" style="display: none; font-size: 30px;"></div>
  </body>
</html>
